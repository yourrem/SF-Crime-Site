version: 2

models:
  - name: stg_incidents
    description: Cleaned and deduplicated view of raw SF incident reports
    columns:
      - name: row_id
        description: Unique identifier per incident
        tests:
          - unique
          - not_null
      - name: incident_date
        tests:
          - not_null
      - name: is_unfounded
        description: True if officially confirmed as false/misreported (resolution = Unfounded)
      - name: is_non_criminal
        description: True if categorised as Non-Criminal — administrative records, not crimes
      - name: is_valid_location
        description: True if lat/long falls within SF bounding box (geocoding sanity check)
